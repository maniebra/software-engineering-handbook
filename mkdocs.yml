site_name: Software Engineering Handbook
site_url: https://maniebra.github.io/software-engineering-handbook/
site_author: Mani Ebrahimi
site_description: >-
      A free, open-source handbook of software engineering concepts, design
      patterns, software architecture, SOLID principles, process models, Agile,
      system design and quality assurance, explained with examples.
repo_url: https://github.com/maniebra/software-engineering-handbook
repo_name: maniebra/software-engineering-handbook
edit_uri: edit/main/
copyright: Copyright &copy; 2026 Mani Ebrahimi, MIT License

# Written by scripts/prepare-docs.sh from the notes at the repository root.
docs_dir: build/docs
site_dir: site

theme:
      name: material
      language: en
      custom_dir: overrides
      font:
            text: Inter
            code: JetBrains Mono
      icon:
            repo: fontawesome/brands/github
      features:
            - navigation.instant
            - navigation.tracking
            - navigation.tabs
            - navigation.sections
            - navigation.footer
            - navigation.top
            - navigation.indexes
            - toc.follow
            - search.suggest
            - search.highlight
            - search.share
            - content.code.copy
            # Picking a language in one content tab switches every other tab set on
            # the site to the same language.
            - content.tabs.link
      palette:
            - media: "(prefers-color-scheme)"
              toggle:
                    icon: material/brightness-auto
                    name: Switch to light mode
            - media: "(prefers-color-scheme: light)"
              scheme: default
              primary: custom
              accent: custom
              toggle:
                    icon: material/brightness-7
                    name: Switch to dark mode
            - media: "(prefers-color-scheme: dark)"
              scheme: slate
              primary: custom
              accent: custom
              toggle:
                    icon: material/brightness-4
                    name: Switch to system preference

plugins:
      - search
      # Renders the <quiz> blocks at the end of the pattern notes as interactive
      # questions with per-answer feedback.
      - mkdocs_quiz:
              # Keep the inputs live after an answer is checked, so the quiz shows a
              # "Try Again" button instead of locking the question.
              disable_after_submit: false
      # Generates the Open Graph / Twitter preview images used when pages are shared.
      # Needs the imaging extras; set SOCIAL=false to skip it for a quick local build.
      - social:
              enabled: !ENV [SOCIAL, true]

extra_css:
      - assets/extra.css

# MathJax renders the $...$ and $$...$$ blocks produced by the arithmatex
# extension; the config file must load before the library itself.
extra_javascript:
      - assets/mathjax.js
      - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
      - admonition
      - attr_list
      - md_in_html
      - tables
      - toc:
              permalink: true
      - pymdownx.arithmatex:
              generic: true
      - pymdownx.details
      - pymdownx.highlight:
              anchor_linenums: true
      - pymdownx.inlinehilite
      - pymdownx.snippets
      - pymdownx.superfences:
              custom_fences:
                    # ```mermaid blocks are rendered client-side by Material's mermaid support.
                    - name: mermaid
                      class: mermaid
                      format: !!python/name:pymdownx.superfences.fence_code_format
      # ```plantuml blocks are rendered to inline SVG at build time by the public
      # PlantUML server. Set PLANTUML_SERVER to point at a self-hosted instance.
      - plantuml_markdown:
              server:
                    !ENV [PLANTUML_SERVER, "https://www.plantuml.com/plantuml"]
              format: svg
              cachedir: .cache/plantuml
      - pymdownx.tabbed:
              alternate_style: true
      - pymdownx.emoji:
              emoji_index: !!python/name:material.extensions.emoji.twemoji
              emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
      social:
            - icon: fontawesome/brands/github
              link: https://github.com/maniebra/software-engineering-handbook
              name: The repository on GitHub

