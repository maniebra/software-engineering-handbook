          - Bridge Pattern: Design Patterns/Bridge Pattern.md
          - Composite Pattern: Design Patterns/Composite Pattern.md
          - Decorator Pattern: Design Patterns/Decorator Pattern.md
          - Facade Pattern: Design Patterns/Facade Pattern.md
          - Flyweight Pattern: Design Patterns/Flyweight Pattern.md
          - Proxy Pattern: Design Patterns/Proxy Pattern.md
      - Behavioural:
