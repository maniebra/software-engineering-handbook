      - Architectural Patterns:
          - Clean Architecture: Software Architecture/Architectural Patterns/Clean Architecture.md
          - Hexagonal Architecture: Software Architecture/Architectural Patterns/Hexagonal.md
          - Layered Architecture: Software Architecture/Architectural Patterns/Layered Architecture.md
          - Event-Driven Architecture: Software Architecture/Architectural Patterns/EDA.md
          - Microservice Architecture: Software Architecture/Architectural Patterns/Microservice Architecture.md
          - MVC: Software Architecture/Architectural Patterns/MVC.md
          - MVVM: Software Architecture/Architectural Patterns/MVVM.md
  - Principles:
