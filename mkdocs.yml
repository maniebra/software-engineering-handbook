          - Command Pattern: Design Patterns/Command Pattern.md
          - Interpreter Pattern: Design Patterns/Interpreter Pattern.md
          - Iterator Pattern: Design Patterns/Iterator Pattern.md
          - Mediator Pattern: Design Patterns/Mediator Pattern.md
          - Memento Pattern: Design Patterns/Memento Pattern.md
          - Observer Pattern: Design Patterns/Observer Pattern.md
          - State Pattern: Design Patterns/State Pattern.md
          - Strategy Pattern: Design Patterns/Strategy Pattern.md
          - Template Method Pattern: Design Patterns/Template Method Pattern.md
          - Visitor Pattern: Design Patterns/Visitor Pattern.md
      - Dependency Injection: Snippets and Cheatsheets/Dependency Injection Pattern.md
  - Architecture:
