      - Planning Principles: Principles/Planning Principles.md
      - Communication Principles: Principles/Communication Principles.md
      - Construction Principles: Principles/Construction Principles.md
      - Deployment Principles: Principles/Deployment Principles.md
      - Practice Principles: Principles/Practice Principles.md
      - Contribution Principles: Principles/Contribution Principles.md
      - Modeling Principles:
